version: '3.8'

networks:
  default:
    external: true
    name: homeserver_network

services:
  # --- CONTENEDOR VPN (ProtonVPN vía WireGuard) ---
  vpn:
    image: qmcgaw/gluetun:latest
    container_name: protonvpn_tunnel
    restart: always
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=CMoLP4CKoBMSjmUx1cEBZsBbNg4Pc14xL/QXdpQ0/XE=
      - WIREGUARD_PUBLIC_KEY=IzfEE9h6+HPn7K1fSmLw8txcAQMvyGFvy1tFmd9YAz4=
      - WIREGUARD_ADDRESSES=10.2.0.2/32
      - WIREGUARD_ENDPOINT_IP=169.150.196.100
      - WIREGUARD_ENDPOINT_PORT=51820
      - TZ=Europe/Madrid
    ports:
      - "192.168.50.100:9696:9696"  # Prowlarr
      - "192.168.50.100:7878:7878"  # Radarr
      - "192.168.50.100:8989:8989"  # Sonarr
      - "192.168.50.100:5656:5656"  # Kapowarr

    ports:
      # Los puertos de los servicios bajo la VPN se mapean AQUÍ:
      - "192.168.50.100:9696:9696"  # Prowlarr
      - "192.168.50.100:7878:7878"  # Radarr
      - "192.168.50.100:8989:8989"  # Sonarr
      - "192.168.50.100:5656:5656"  # Kapowarr (Añadido)

  # --- INDEXADOR DE TRACKERS (Bajo VPN) ---
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:develop
    container_name: prowlarr
    restart: always
    network_mode: "service:vpn"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    volumes:
      - ./config/prowlarr:/config
    depends_on:
      - vpn

  # --- GESTOR DE PELÍCULAS (Bajo VPN) ---
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: always
    network_mode: "service:vpn"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    volumes:
      - ./config/radarr:/config
      - /home/data:/data
    depends_on:
      - vpn

  # --- GESTOR DE SERIES (Bajo VPN) ---
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: always
    network_mode: "service:vpn"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    volumes:
      - ./config/sonarr:/config
      - /home/data:/data
    depends_on:
      - vpn

  # --- GESTOR DE CÓMICS (Bajo VPN) ---
  kapowarr:
    image: mrcas/kapowarr:latest
    container_name: kapowarr
    restart: always
    network_mode: "service:vpn"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    volumes:
      - ./config/kapowarr:/config
      - /home/data:/data # Acceso a descargas y biblioteca de cómics
    depends_on:
      - vpn

  # --- GESTOR DE DESCARGAS (Fuera de la VPN - Fibra directa) ---
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: always
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
      - WEBUI_PORT=8080
    ports:
      - "192.168.50.100:8089:8080" # Acceso Web UI
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - ./config/qbittorrent:/config
      - /home/data:/data

  # --- EXTRACCIÓN AUTOMÁTICA DE RAR/ZIP (Fuera de la VPN) ---
  unpackerr:
    image: golift/unpackerr:latest
    container_name: unpackerr
    restart: always
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
      # Integración con Radarr/Sonarr (puedes dejarlas en blanco y configurarlo luego)
      - UN_SONARR_0_URL=http://192.168.50.100:8989
      - UN_SONARR_0_API_KEY=TU_API_KEY_DE_SONARR
      - UN_RADARR_0_URL=http://192.168.50.100:7878
      - UN_RADARR_0_API_KEY=TU_API_KEY_DE_RADARR
    volumes:
      - ./config/unpackerr:/config
      - /home/data:/data # Es vital que tenga acceso exacto a las carpetas que lee qBittorrent

  # --- SERVIDOR MULTIMEDIA (Fuera de la VPN) ---
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    restart: always
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    ports:
      - "192.168.50.100:8096:8096"
    volumes:
      - ./config/jellyfin:/config
      - /home/data/media:/data/media:ro

networks:
  default:
    name: homeserver_network

volumes:
  immich_db:

services:
# --- WATCHTOWER ---
  watchtower:
    image: nickfedor/watchtower:latest # <-- Cambiado a la versión actualizada y activa
    container_name: watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_SCHEDULE=0 0 4 1 * *
      - TZ=Europe/Madrid
      - WATCHTOWER_NOTIFICATIONS=shoutrrr
      - WATCHTOWER_NOTIFICATION_URL=discord://CK-oL_-8_H0yQfGMBq8Nvy7FSJ6jxmdy6M-ZN4Kfg48ymeUHiVI1NBdIiT5pFAbz5Oxy@1204829342484537384
      - WATCHTOWER_NOTIFICATIONS_HOSTNAME=ArchServer-2 # <-- Así el mensaje en Discord llevará este título

  # --- PORTAINER ---
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: always
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/portainer:/data
    ports:
      - "192.168.50.100:9443:9443"
      - "192.168.50.100:9000:9000"

  # --- ADGUARD HOME (REEMPLAZO DE PI-HOLE) ---
  adguard-backup:
    image: adguard/adguardhome:latest
    container_name: adguard-backup
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./data/adguard-work:/opt/adguardhome/work
      - ./data/adguard-data:/opt/adguardhome/conf
    labels:
      - "com.centurylinklabs.watchtower.enable=false"  # <-- Dos espacios más a la derecha que antes


  # --- ADGUARD HOME SYNC (EL SINCRONIZADOR) ---
  adguard-sync:
    image: ghcr.io/bakito/adguardhome-sync:latest
    container_name: adguard-sync
    restart: unless-stopped
    command: run
    environment:
      - ORIGIN_URL=http://192.168.50.150:3001
      - ORIGIN_USERNAME=inhumano
      - ORIGIN_PASSWORD=Pacopicopoco.7
      - REPLICA_URL=http://192.168.50.100:3001  # <-- CAMBIADO AQUÍ CON TU IP FIJA
      - REPLICA_USERNAME=inhumano
      - REPLICA_PASSWORD=Pacopicopoco.7
      - CRON=*/10 * * * * # Ejecuta una sincronización automática en segundo plano cada 10 minutos
      - TZ=Europe/Madrid

  # --- HOMEPAGE ---
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: always
    ports:
      - "192.168.50.100:3006:3000" # <-- Cambiado de 3000 a 3006 externo
    volumes:
      - ./data/homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/mnt/host:ro
    environment:
      - TZ=Europe/Madrid
      - HOMEPAGE_ALLOWED_HOSTS=192.168.50.100,192.168.50.100:3006 # <-- Cambiado aquí también


  # --- GLANCES ---
  glances:
    image: nicolargo/glances:latest-full
    container_name: glances
    restart: always
    pid: host
    privileged: true
    networks:
      - default
    environment:
      - GLANCES_OPT=-w
      - TZ=Europe/Madrid
      - LANG=es_ES.UTF-8
      - GLANCES_HOST_MOUNT=/mnt/host
      - PREFIX_PROCFS=/mnt/host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/mnt/host:ro
      - /etc/os-release:/etc/os-release:ro

  # --- GESTOR DE DESCARGAS ---
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: always
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
      - WEBUI_PORT=8080
    ports:
      - "192.168.50.100:8089:8080"
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - /home/inhumano/docker-arr/config/qbittorrent:/config
      - /home/data:/data

  # --- JACKETT: INDEXADOR COMPLEMENTARIO PARA RASTREADORES HISPANOS ---
  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: jackett
    restart: always
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    ports:
      - "192.168.50.100:9117:9117"
    volumes:
      - ./data/jackett:/config
    networks:
      - default

  # --- FLARESOLVERR: EVITAR BLOQUEOS Y CLOUDFLARE ---
  flaresolverr:
    image: 21hsmw/flaresolverr:nodriver 
    container_name: flaresolverr
    restart: always
    environment:
      - LOG_LEVEL=info
      - TZ=Europe/Madrid
    ports:
      - "192.168.50.100:8191:8191"
    networks:
      - default

  # --- PROWLARR: INDEXADOR Y BUSCADOR CENTRALIZADO ---
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: always
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    ports:
      - "192.168.50.100:9696:9696"
    volumes:
      - ./data/prowlarr:/config
    networks:
      - default

  # --- SERVIDOR MULTIMEDIA ---
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    restart: always
    group_add:
      - "987"
    devices:
      - /dev/dri:/dev/dri
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    ports:
      - "192.168.50.100:8096:8096"
    volumes:
      # 👇 AHORA SÍ: RUTA RELATIVA HOMOGÉNEA COMO LAS DEMÁS aplicaciones
      - ./data/jellyfin:/config
      - /home/data:/data:ro


  # --- JELLYSEERR ---
  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    restart: always
    environment:
      - LOG_LEVEL=debug
      - TZ=Europe/Madrid
    ports:
      - "192.168.50.100:5055:5055"
    volumes:
      - ./data/jellyseerr:/app/config
    networks:
      - default

  # --- SONARR ---
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: always
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    ports:
      - "192.168.50.100:8989:8989"
    volumes:
      - ./data/sonarr:/config
      - /home/data:/data
    networks:
      - default

  # --- RADARR ---
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: always
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    ports:
      - "192.168.50.100:7878:7878"
    volumes:
      - ./data/radarr:/config
      - /home/data:/data
    networks:
      - default

 # --- FILEGATOR - Gestor de archivos web (Alternativa a Filebrowser) ---
  filegator:
    image: filegator/filegator:latest
    container_name: filegator
    restart: always
    security_opt:
      - no-new-privileges:true
    networks:
      - default                            # Conectado a homeserver_network
    ports:
      - "192.168.50.100:8082:8080"        # Mapeado a tu IP del segundo server en puerto 8082
    volumes:
      - /home:/var/www/filegator/repository # Mapea la raíz /home de ArchServer-2
    environment:
      - TZ=Europe/Madrid
      - FILEGATOR_PRIVATE=/var/www/filegator/private # Evita el error de permisos en logs locales

  # --- IMMICH: SERVIDOR DE FOTOS ---
  immich-server:
    image: ghcr.io/immich-app/immich-server:release
    container_name: immich_server
    volumes:
      - ./data/immich/photos:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    environment:
      - DB_DATA_LOCATION=immich_db
      - DB_DATABASE_NAME=immich
      - DB_USERNAME=postgres
      - DB_PASSWORD=immich_secure_pass
      - DB_HOSTNAME=immich-database
      - REDIS_HOSTNAME=immich-redis
      - IMMICH_MACHINE_LEARNING_URL=http://immich-machine-learning:3003
    ports:
      - "192.168.50.100:2283:2283"
    depends_on:
      - immich-database
      - immich-redis
    restart: always

  # --- IMMICH: INTELIGENCIA ARTIFICIAL ---
  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:release
    container_name: immich_machine_learning
    volumes:
      - ./data/immich/cache:/cache
    restart: always

  # --- IMMICH: BASE DE DATOS OFICIAL ---
  immich-database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    container_name: immich_database
    environment:
      - POSTGRES_DB=immich
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=immich_secure_pass
    volumes:
      - immich_db:/var/lib/postgresql/data
    restart: always

  # --- IMMICH: REDIS ---
  immich-redis:
    image: redis:7-alpine
    container_name: immich_redis
    restart: always

networks:
  default:
    name: homeserver_network

volumes:
  immich_db:

services:
  # --- WATCHTOWER (Actualizaciones Automáticas de Contenedores) ---
  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=2592000
      - TZ=Europe/Madrid

  # --- PORTAINER (Gestión de Contenedores) ---
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: always
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/portainer:/data
    ports:
      - "9443:9443"
      - "9000:9000"

  # --- PI-HOLE (Bloqueador de Publicidad y DNS) ---
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    restart: always
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8080:80/tcp"
    environment:
      - TZ=Europe/Madrid
      - WEBPASSWORD=TuContraseñaSeguraParaPihole
    volumes:
      - ./data/pihole:/etc/pihole
      - ./data/dnsmasq.d:/etc/dnsmasq.d

  # --- HEIMDALL (Panel de Inicio / Dashboard) ---
  heimdall:
    image: lscr.io/linuxserver/heimdall:latest
    container_name: heimdall
    restart: always
    environment:
      - PUID=1000
      - PGID=966
      - TZ=Europe/Madrid
    volumes:
      - ./data/heimdall:/config
    ports:
      - "8090:80"

  # --- NGINX PROXY MANAGER (Proxy Inverso y SSL) ---
  nginx-proxy-manager:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: nginx-proxy-manager
    restart: always
    ports:
      - '80:80'
      - '81:81'
      - '443:443'
    volumes:
      - ./data/nginx/data:/data
      - ./data/nginx/letsencrypt:/etc/letsencrypt

  # --- IMMICH: SERVIDOR DE FOTOS ---
  immich-server:
    image: ghcr.io/immich-app/immich-server:release
    container_name: immich_server
    volumes:
      - ./data/immich/photos:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    environment:
      - DB_DATA_LOCATION=immich_db
      - DB_DATABASE_NAME=immich
      - DB_USERNAME=postgres
      - DB_PASSWORD=immich_secure_pass
      - DB_HOSTNAME=immich-database
      - REDIS_HOSTNAME=immich-redis
      - IMMICH_MACHINE_LEARNING_URL=http://immich-machine-learning:3003
    ports:
      - "2283:2283"
    depends_on:
      - immich-database
      - immich-redis
    restart: always

  # --- IMMICH: INTELIGENCIA ARTIFICIAL ---
  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:release
    container_name: immich_machine_learning
    volumes:
      - ./data/immich/cache:/cache
    restart: always

  # --- IMMICH: BASE DE DATOS OFICIAL ---
  immich-database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    container_name: immich_database
    environment:
      - POSTGRES_DB=immich
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=immich_secure_pass
    volumes:
      - immich_db:/var/lib/postgresql/data
    restart: always

  # --- IMMICH: REDIS (Cola de tareas) ---
  immich-redis:
    image: redis:7-alpine
    container_name: immich_redis
    restart: always

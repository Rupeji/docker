services:
  # 1. ADGUARD HOME - DNS Centralizador y Bloqueador
  adguard:
    image: adguard/adguardhome:latest
    container_name: adguard-home
    labels:
      - "com.centurylinklabs.watchtower.enable=false" # <- ESTA LÍNEA LO 
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./adguard-work:/opt/adguardhome/work
      - ./adguard-data:/opt/adguardhome/conf

  # 2. LANCACHE MONOLITHIC - Servidor Caché de Juegos
  monolithic:
    image: lancachenet/monolithic:latest
    container_name: lancache-monolithic
    restart: unless-stopped
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
    environment:
      - CACHE_DISK_SIZE=2500g
      - CACHE_MEM_SIZE=4096m
      - CACHE_MAX_AGE=356d
      - UPSTREAM_DNS=1.1.1.1
    volumes:
      - ./cache-data:/data/cache
      - ./cache-logs:/data/logs

  # 3. SKARONATOR (lancache-dns-sync) - Sincronizador de Dominios
  skaronator:
    image: ghcr.io/skaronator/lancache-dns-sync:latest
    container_name: lancache-skaronator
    restart: unless-stopped
    depends_on:
      - adguard
    environment:
      - ADGUARD_API=http://192.168.50.150:3001
      - ADGUARD_USERNAME=inhumano
      - ADGUARD_PASSWORD=Pacopicopoco.7  # <-- Asegúrate de poner tu contraseña real
      - LANCACHE_SERVER=192.168.50.150
      - SERVICE_NAMES=*
      - CRON_SCHEDULE=0 4 * * *

  # 4. LANCACHE MANAGER - Interfaz de control y analíticas
  manager:
    image: ghcr.io/regix1/lancache-manager:latest
    container_name: lancache-manager
    restart: unless-stopped
    ports:
      - "8080:80/tcp"
    volumes:
      - ./manager-data:/data
      - ./cache-logs:/logs
      - /var/run/docker.sock:/var/run/docker.sock

  # 5. LANCACHE DASHBOARD - Compilado directamente desde GitHub con tu sintaxis
  dashboard:
    container_name: lancache-dashboard
    restart: always
    build:
      context: https://github.com/imahmud1/lancache-dashboard.git#main
    ports:
      - "3010:3000/tcp"                 # Mapea el puerto 3010 externo al 3000 interno de Next.js
    environment:
      - LOG_PATH=/logs/access.log       # Ruta del archivo log dentro del contenedor
      - DB_PATH=/app/data/lancache.db   # Ruta de persistencia de la base de datos
    volumes:
      - ./cache-logs:/logs:ro           # Pasa la carpeta de logs de Monolithic en modo lectura
      - ./dashboard-data:/app/data      # Pasa la carpeta de datos persistente

  # 6. WATCHTOWER - Actualizador automático de imágenes Docker
  watchtower:
    image: nickfedor/watchtower:latest
    container_name: watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_SCHEDULE=0 0 3 1 * * # <-- Modificado a las 3:00 AM el día 1 de cada mes
      - TZ=Europe/Madrid
      - WATCHTOWER_NOTIFICATIONS=shoutrrr
      - WATCHTOWER_NOTIFICATION_URL=discord://CK-oL_-8_H0yQfGMBq8Nvy7FSJ6jxmdy6M-ZN4Kfg48ymeUHiVI1NBdIiT5pFAbz5Oxy@1204829342484537384
      - WATCHTOWER_NOTIFICATIONS_HOSTNAME=ArchServer-1 # <-- Así el mensaje en Discord llevará este título

  # 7. PORTAINER - Interfaz web de gestión para Docker
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: always
    security_opt:
      - no-new-privileges:true
    ports:
      - "192.168.50.150:9443:9443"
      - "192.168.50.150:9000:9000"
    environment:
      - PORTAINER_NO_SETUP_TOKEN=1 # <--- Añade esta línea aquí
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./portainer-data:/data


  # 8. HOMEPAGE - Panel de inicio personalizable (Dashboard de servicios)
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: always
    ports:
      - "192.168.50.150:3005:3000" # Mapeado a 3005 externo para evitar conflicto con el puerto 3000 del contenedor dashboard
    volumes:
      - ./homepage-config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/mnt/host:ro
    environment:
      - TZ=Europe/Madrid
      - HOMEPAGE_ALLOWED_HOSTS=192.168.50.150,192.168.50.150:3005

  # 9. GLANCES - Monitorización avanzada del sistema en tiempo real
  glances:
    image: nicolargo/glances:latest-full
    container_name: glances
    restart: always
    pid: host
    privileged: true
    environment:
      - GLANCES_OPT=-w
      - TZ=Europe/Madrid
      - LANG=es_ES.UTF-8
      - GLANCES_HOST_MOUNT=/mnt/host
      - PREFIX_PROCFS=/mnt/host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/mnt/host:ro
      - /etc/os-release:/etc/os-release:ro

  # 10. FILEGATOR - Gestor de archivos web multiusuario (Alternativa a Filebrowser)
  filegator:
    image: filegator/filegator:latest
    container_name: filegator
    restart: always
    security_opt:
      - no-new-privileges:true
    ports:
      - "192.168.50.150:8082:8080"
    volumes:
      - /home:/var/www/filegator/repository # Mapea tu almacenamiento /home
    environment:
      - TZ=Europe/Madrid
      - FILEGATOR_PRIVATE=/var/www/filegator/private # Fuerza al contenedor a usar su estructura interna por defecto

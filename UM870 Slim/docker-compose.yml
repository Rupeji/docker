services:
  # 1. ADGUARD HOME - DNS Centralizador (CRÍTICO: No actualizar automáticamente)
  adguard:
    image: adguard/adguardhome:latest
    container_name: adguard-home
    restart: unless-stopped
    network_mode: host
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    volumes:
      - ./adguard-work:/opt/adguardhome/work
      - ./adguard-data:/opt/adguardhome/conf

  # 2. LANCACHE MONOLITHIC - Servidor Caché (Estable: Evitar cambios inesperados)
  monolithic:
    image: lancachenet/monolithic:latest
    container_name: lancache-monolithic
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
    environment:
      - CACHE_DISK_SIZE=2500g
      - CACHE_MEM_SIZE=4096m
      - CACHE_MAX_AGE=356d
      - UPSTREAM_DNS=1.1.1.1
    volumes:
      - ./cache-data:/data/cache
      - ./cache-logs:/data/logs

  # 3. SKARONATOR - Sincronizador de Dominios (Seguro de actualizar)
  skaronator:
    image: ghcr.io/skaronator/lancache-dns-sync:latest
    container_name: lancache-skaronator
    restart: unless-stopped
    depends_on:
      - adguard
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      - ADGUARD_API=http://192.168.50.150:3001
      - ADGUARD_USERNAME=inhumano
      - ADGUARD_PASSWORD=Pacopicopoco.7
      - LANCACHE_SERVER=192.168.50.150
      - SERVICE_NAMES=*
      - CRON_SCHEDULE=0 4 * * *

  # 4. LANCACHE MANAGER - Interfaz de control (Seguro de actualizar con tus fixes)
  manager:
    image: ghcr.io/regix1/lancache-manager:latest
    container_name: lancache-manager
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "8085:80/tcp"
    environment:
      - DOCKER_NETWORK=lancache-stack_default
      - DOCKER_DNS=192.168.50.150
    volumes:
      - ./manager-data:/data
      - ./cache-logs:/logs
      - /var/run/docker.sock:/var/run/docker.sock

  # 5. LANCACHE DASHBOARD - Compilado de GitHub (RIESGO: No actualizar automáticamente)
  dashboard:
    container_name: lancache-dashboard
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    build:
      context: https://github.com
    ports:
      - "3010:3000/tcp"
    environment:
      - LOG_PATH=/logs/access.log
      - DB_PATH=/app/data/lancache.db
    volumes:
      - ./cache-logs:/logs:ro
      - ./dashboard-data:/app/data

  # 6. WATCHTOWER - Actualizador automático
  watchtower:
    image: nickfedor/watchtower:latest
    container_name: watchtower
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_SCHEDULE=0 0 3 1 * *
      - TZ=Europe/Madrid
      - WATCHTOWER_NOTIFICATIONS=shoutrrr
      - WATCHTOWER_NOTIFICATION_URL=discord://CK-oL_-8_H0yQfGMBq8Nvy7FSJ6jxmdy6M-ZN4Kfg48ymeUHiVI1NBdIiT5pFAbz5Oxy@1204829342484537384
      - WATCHTOWER_NOTIFICATIONS_HOSTNAME=ArchServer-1

  # 7. PORTAINER - Panel Web de Docker (CRÍTICO: No actualizar automáticamente)
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: always
    security_opt:
      - no-new-privileges:true
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    ports:
      - "192.168.50.150:9443:9443"
      - "192.168.50.150:9000:9000"
    environment:
      - PORTAINER_NO_SETUP_TOKEN=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./portainer-data:/data

  # 8. HOMEPAGE - Dashboard Personal (Seguro de actualizar)
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "192.168.50.150:3005:3000"
    volumes:
      - ./homepage-config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/mnt/host:ro
    environment:
      - TZ=Europe/Madrid
      - HOMEPAGE_ALLOWED_HOSTS=192.168.50.150,192.168.50.150:3005

  # 9. GLANCES - Monitorización (Seguro de actualizar)
  glances:
    image: nicolargo/glances:latest-full
    container_name: glances
    restart: always
    pid: host
    privileged: true
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      - GLANCES_OPT=-w
      - TZ=Europe/Madrid
      - LANG=es_ES.UTF-8
      - GLANCES_HOST_MOUNT=/mnt/host
      - PREFIX_PROCFS=/mnt/host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/mnt/host:ro
      - /etc/os-release:/etc/os-release:ro

  # 10. FILEGATOR - Gestor de archivos (Seguro de actualizar)
  filegator:
    image: filegator/filegator:latest
    container_name: filegator
    restart: always
    security_opt:
      - no-new-privileges:true
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "192.168.50.150:8082:8080"
    volumes:
      - /home:/var/www/filegator/repository
    environment:
      - TZ=Europe/Madrid
      - FILEGATOR_PRIVATE=/var/www/filegator/private
